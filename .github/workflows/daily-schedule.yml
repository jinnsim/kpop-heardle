name: Daily schedule picker

on:
  schedule:
    # 15:00 UTC = 00:00 KST. Runs once per day.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD)"
        required: false
        default: ""
      days:
        description: "How many consecutive days to populate"
        required: false
        default: "7"

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Populate a rolling buffer of days ahead, so a single failed run
      # (e.g. GitHub not acquiring a hosted runner) leaves no gap in the
      # schedule. The picker skips dates that already exist, so re-running
      # over the same window is idempotent.
      - name: Run schedule picker
        env:
          DATE: ${{ inputs.date }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          if [ -n "$DATE" ]; then
            python catalog/scripts/schedule_picker.py \
              --catalog catalog/data/catalog.json \
              --date "$DATE" \
              --days "$DAYS"
          else
            python catalog/scripts/schedule_picker.py \
              --catalog catalog/data/catalog.json \
              --days "$DAYS"
          fi

      - name: Mirror catalog to public/ for Cloudflare Pages
        run: |
          mkdir -p public
          cp catalog/data/catalog.json public/catalog.json

      - name: Commit if changed
        run: |
          git config user.name "kpop-heardle-bot"
          git config user.email "bot@kpop-heardle.local"
          if [ -n "$(git status --porcelain)" ]; then
            git add catalog/data/catalog.json public/catalog.json
            git commit -m "daily: schedule pick $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no schedule change"
          fi

      # ⚠️ 커밋만으로는 사용자에게 닿지 않는다. 앱은 jsDelivr(@main)에서 카탈로그를
      # 받고 그 CDN 은 최대 12시간 낡은 사본을 계속 준다 — 2026-09-08 에 잘못된
      # 곡(오페라 아리아)을 걷어낸 카탈로그가 CDN 에 안 떠서 손으로 퍼지했다.
      - name: Purge jsDelivr cache
        if: success()
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/public/catalog.json"
